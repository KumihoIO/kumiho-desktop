name: desktop-release

# Push a tag like `desktop-v0.1.0` to build installers for all desktop platforms
# and attach them to a (draft) GitHub Release:
#   Windows  → NSIS .exe (+ .msi)
#   Linux    → .deb + .AppImage
#   macOS    → .dmg
# Each build bundles kumiho-brain plus the matching private 9miho prebuild as
# sidecars, so users never need source access or GitHub credentials.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  # One release, created once, before any build. Without this the three matrix
  # jobs each create their own release: GitHub does NOT key drafts by tag, so
  # duplicate drafts appear for the same tag and the assets split between them
  # (v0.1.2 shipped mac+win in one draft and all three Linux bundles in another).
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.mk.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: mk
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo
            const tag = process.env.TAG
            // Re-runs must reuse the release, not add another one.
            const all = await github.paginate(github.rest.repos.listReleases, { owner, repo })
            const found = all.find(r => r.tag_name === tag)
            if (found) return found.id
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `Kumiho Desktop ${tag}`,
              draft: true,
              prerelease: false,
            })
            return data.id

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialize the matrix: all three jobs update the SAME release's
      # latest.json, and tauri-action does read-existing-then-reupload. Run in
      # parallel and it's a last-writer-wins race that drops platform entries;
      # sequential, each job merges its platform onto the previous manifest.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            miho_platform: windows
            miho_arch: x64
            # WiX/MSI packaging cannot currently bundle the private 9miho
            # sidecar reliably. NSIS is the existing updater-compatible
            # Windows installer and avoids the failing Candle toolchain.
            bundle_args: --bundles nsis
          - os: ubuntu-22.04
            miho_platform: linux
            miho_arch: x64
            bundle_args: ""
          - os: macos-15
            miho_platform: macos
            miho_arch: arm64
            bundle_args: ""
          - os: macos-15-intel
            miho_platform: macos
            miho_arch: x64
            bundle_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Desktop shell regression checks
        shell: bash
        run: |
          node scripts/test-active-server-health.cjs
          node scripts/test-html5-file-drop.cjs
          node scripts/test-9miho-update.cjs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies (Tauri / WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev pkg-config   # keyring sync-secret-service → dbus-secret-service

      - name: 9miho updater unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked miho

      - name: Build kumiho-brain and stage it as a sidecar
        shell: bash
        run: |
          # Root crate = kumiho-brain (the axum + WebGL2 "See" server).
          cargo build --release --manifest-path Cargo.toml
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/kumiho-brain.exe" "src-tauri/binaries/kumiho-brain-${TRIPLE}.exe"
          else
            cp "target/release/kumiho-brain" "src-tauri/binaries/kumiho-brain-${TRIPLE}"
            chmod +x "src-tauri/binaries/kumiho-brain-${TRIPLE}"
          fi
          echo "staged sidecar: kumiho-brain-${TRIPLE}"

      - name: Python for private prebuild extraction
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read pinned 9miho release
        id: miho
        shell: bash
        run: |
          TAG=$(node -p "require('./src-tauri/9miho-version.json').release_tag")
          VERSION=$(node -p "require('./src-tauri/9miho-version.json').version")
          COMMIT=$(node -p "require('./src-tauri/9miho-version.json').commit")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Download and stage the private 9miho prebuild
        if: ${{ !startsWith(matrix.os, 'macos-') }}
        shell: bash
        env:
          # A fine-grained PAT or GitHub App token with read-only Contents access
          # to KumihoIO/9miho. It is used only in CI and never enters the bundle.
          GH_TOKEN: ${{ secrets.NINE_MIHO_RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.miho.outputs.tag }}"
          VERSION="${{ steps.miho.outputs.version }}"
          ARCHIVE="9miho-${{ matrix.miho_platform }}-${{ matrix.miho_arch }}.zip"
          test -n "$GH_TOKEN" || (echo "NINE_MIHO_RELEASE_TOKEN is not configured" >&2; exit 1)
          mkdir -p 9miho-download 9miho-prebuilt src-tauri/binaries
          gh release download "$TAG" --repo KumihoIO/9miho --pattern "$ARCHIVE*" --dir 9miho-download
          python -c "import hashlib,pathlib; p=pathlib.Path('9miho-download/$ARCHIVE'); expected=pathlib.Path(str(p)+'.sha256').read_text().split()[0]; actual=hashlib.sha256(p.read_bytes()).hexdigest(); assert actual==expected, (actual,expected)"
          python -m zipfile -e "9miho-download/$ARCHIVE" 9miho-prebuilt
          python -c "import json; m=json.load(open('9miho-prebuilt/manifest.json')); assert (m['version'],m['platform'],m['arch'],m['api_port'])==('$VERSION','${{ matrix.miho_platform }}','${{ matrix.miho_arch }}',9999), m"
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp 9miho-prebuilt/9miho.exe "src-tauri/binaries/9miho-${TRIPLE}.exe"
          else
            cp 9miho-prebuilt/9miho "src-tauri/binaries/9miho-${TRIPLE}"
            chmod +x "src-tauri/binaries/9miho-${TRIPLE}"
          fi
          echo "staged 9miho $VERSION for $TRIPLE"

      - name: Import Apple Developer ID (macOS)
        if: startsWith(matrix.os, 'macos-')
        uses: Apple-Actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Checkout pinned private 9miho source (macOS)
        if: startsWith(matrix.os, 'macos-')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KumihoIO/9miho
          ref: ${{ steps.miho.outputs.tag }}
          token: ${{ secrets.NINE_MIHO_RELEASE_TOKEN }}
          path: 9miho-source
          persist-credentials: false

      - name: uv for signed 9miho build (macOS)
        if: startsWith(matrix.os, 'macos-')
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: pnpm for signed 9miho build (macOS)
        if: startsWith(matrix.os, 'macos-')
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Keep this aligned with 9miho's packageManager field. The action
          # runs from the desktop checkout root, so it cannot discover the
          # nested 9miho-source/package.json on its own.
          version: 11.15.1

      - name: Node for signed 9miho build (macOS)
        if: startsWith(matrix.os, 'macos-')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: 9miho-source/pnpm-lock.yaml

      - name: Build and stage same-Team 9miho sidecar (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MIHO_VERSION: ${{ steps.miho.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY" || (echo "APPLE_SIGNING_IDENTITY is not configured" >&2; exit 1)
          test "$(git -C 9miho-source rev-parse HEAD)" = "${{ steps.miho.outputs.commit }}" || \
            (echo "pinned 9miho tag does not resolve to the expected commit" >&2; exit 1)
          cd 9miho-source
          uv sync --frozen
          pnpm install --frozen-lockfile
          pnpm build
          uv run --with pyinstaller==6.21.0 python scripts/build_prebuilt.py \
            --version "$MIHO_VERSION" \
            --codesign-identity "$APPLE_SIGNING_IDENTITY"
          output/prebuild/stage/9miho --version | grep -Fx "9miho $MIHO_VERSION"
          cd ..
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          cp 9miho-source/output/prebuild/stage/9miho "src-tauri/binaries/9miho-${TRIPLE}"
          chmod +x "src-tauri/binaries/9miho-${TRIPLE}"
          codesign --verify --strict --verbose=2 "src-tauri/binaries/9miho-${TRIPLE}"
          echo "staged same-Team 9miho $MIHO_VERSION for $TRIPLE"

      - name: Restore App Store Connect API key (macOS notarization)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build + release Kumiho Desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (all platforms) — produces the .sig files + latest.json
          # that the in-app auto-updater verifies against the embedded public key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing + notarization — macOS runner only.
          # The certificate is imported once above so both PyInstaller and
          # Tauri use the same keychain identity and Team ID.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.os, 'macos-') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ startsWith(matrix.os, 'macos-') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: .
          # Upload into the release created above — never create one here.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Add the sidecar only for the release build so local `cargo tauri dev`
          # (which has no staged sidecar) keeps working.
          args: '${{ matrix.bundle_args }} --config {"bundle":{"externalBin":["binaries/kumiho-brain","binaries/9miho"]}}'

      - name: Verify signed 9miho sidecar (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "src-tauri/target/release/bundle/macos" -name '*.app' -type d -print -quit)
          test -n "$APP" || (echo "Kumiho Desktop app bundle was not found" >&2; exit 1)
          SIDECAR="$APP/Contents/MacOS/9miho"
          test -n "$SIDECAR" || (echo "signed 9miho sidecar was not found" >&2; exit 1)
          test -x "$SIDECAR" || (echo "signed 9miho sidecar is not executable" >&2; exit 1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$SIDECAR"
          APP_TEAM=$(codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          SIDECAR_TEAM=$(codesign -dv --verbose=4 "$SIDECAR" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          test -n "$APP_TEAM" || (echo "app has no TeamIdentifier" >&2; exit 1)
          test "$APP_TEAM" = "$SIDECAR_TEAM" || (echo "Team ID mismatch: app=$APP_TEAM sidecar=$SIDECAR_TEAM" >&2; exit 1)
          codesign --display --entitlements :- "$APP" > app-entitlements.plist 2>/dev/null
          if test -s app-entitlements.plist; then
            plutil -lint app-entitlements.plist
            if plutil -extract com.apple.security.cs.disable-library-validation raw app-entitlements.plist >/dev/null 2>&1; then
              echo "Library Validation must remain enabled" >&2
              exit 1
            fi
          fi
          "$SIDECAR" --version | grep -Fx "9miho ${{ steps.miho.outputs.version }}"
