name: desktop-release

# Push a tag like `desktop-v0.1.0` to build installers for all desktop platforms
# and attach them to a (draft) GitHub Release:
#   Windows  → NSIS .exe (+ .msi)
#   Linux    → .deb + .AppImage
#   macOS    → .dmg
# Each build bundles the kumiho-brain binary as a sidecar, so the installed app's
# "See" view works with no separate install.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies (Tauri / WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build kumiho-brain and stage it as a sidecar
        shell: bash
        run: |
          # Root crate = kumiho-brain (the axum + WebGL2 "See" server).
          cargo build --release --manifest-path Cargo.toml
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/kumiho-brain.exe" "src-tauri/binaries/kumiho-brain-${TRIPLE}.exe"
          else
            cp "target/release/kumiho-brain" "src-tauri/binaries/kumiho-brain-${TRIPLE}"
            chmod +x "src-tauri/binaries/kumiho-brain-${TRIPLE}"
          fi
          echo "staged sidecar: kumiho-brain-${TRIPLE}"

      - name: Build + release Kumiho Desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Kumiho Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Add the sidecar only for the release build so local `cargo tauri dev`
          # (which has no staged sidecar) keeps working.
          args: '--config {"bundle":{"externalBin":["binaries/kumiho-brain"]}}'
