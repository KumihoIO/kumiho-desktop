name: desktop-release

# Push a tag like `desktop-v0.1.0` to build installers for all desktop platforms
# and attach them to a (draft) GitHub Release:
#   Windows  → NSIS .exe (+ .msi)
#   Linux    → .deb + .AppImage
#   macOS    → .dmg
# Each build bundles the kumiho-brain binary as a sidecar, so the installed app's
# "See" view works with no separate install.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  # One release, created once, before any build. Without this the three matrix
  # jobs each create their own release: GitHub does NOT key drafts by tag, so
  # duplicate drafts appear for the same tag and the assets split between them
  # (v0.1.2 shipped mac+win in one draft and all three Linux bundles in another).
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.mk.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: mk
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo
            const tag = process.env.TAG
            // Re-runs must reuse the release, not add another one.
            const all = await github.paginate(github.rest.repos.listReleases, { owner, repo })
            const found = all.find(r => r.tag_name === tag)
            if (found) return found.id
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `Kumiho Desktop ${tag}`,
              draft: true,
              prerelease: false,
            })
            return data.id

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies (Tauri / WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build kumiho-brain and stage it as a sidecar
        shell: bash
        run: |
          # Root crate = kumiho-brain (the axum + WebGL2 "See" server).
          cargo build --release --manifest-path Cargo.toml
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/kumiho-brain.exe" "src-tauri/binaries/kumiho-brain-${TRIPLE}.exe"
          else
            cp "target/release/kumiho-brain" "src-tauri/binaries/kumiho-brain-${TRIPLE}"
            chmod +x "src-tauri/binaries/kumiho-brain-${TRIPLE}"
          fi
          echo "staged sidecar: kumiho-brain-${TRIPLE}"

      - name: Restore App Store Connect API key (macOS notarization)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build + release Kumiho Desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing + notarization — macOS runner only. Left empty on the
          # Linux/Windows jobs so tauri never attempts a keychain import there.
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: .
          # Upload into the release created above — never create one here.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Add the sidecar only for the release build so local `cargo tauri dev`
          # (which has no staged sidecar) keeps working.
          args: '--config {"bundle":{"externalBin":["binaries/kumiho-brain"]}}'
