# kumiho-desktop — Tauri control-center. The Brain graph view (See pillar) is the
# root kumiho-brain server, spawned as a child process and shown in an iframe;
# the Run/Account/Connect/Upgrade pillars are native commands here.
#
# Own [workspace] so it stays independent of the root kumiho-brain crate.
[package]
name = "kumiho-desktop"
version = "0.5.0"
edition = "2021"
rust-version = "1.77"
description = "Kumiho Desktop — control center for Kumiho Memory, 9miho, and CE/Cloud connections"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"          # in-app auto-update (signed artifacts + latest.json)
tauri-plugin-single-instance = "2"  # collapse a duplicate launch (updater relaunch on Windows)
tauri-plugin-autostart = "2"        # "launch at login" (Run key / LaunchAgent / .desktop)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"    # Revka: read its active_workspace.toml without guessing escaped paths
semver = "1"
dirs = "5"      # locate ~/.kumiho for the Run pillar
ureq = "2"      # Account: probe the cloud control plane natively — a webview
                # fetch to control.kumiho.cloud is CORS-blocked (no ACAO header)
sha2 = "0.10"   # component updates: verify the published archive checksum
minisign-verify = "0.2" # component updates: verify archives with the Desktop updater key
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"         # Revka: unix release archives are tar.gz
flate2 = "1"        # Revka: gzip reader for the tar archives
portable-pty = "0.9" # Revka onboarding terminal: real PTY (ConPTY/OpenPTY) for the interactive wizard

# Retiring 9miho: SIGTERM before SIGKILL so the PyInstaller onefile runtime can
# remove its extracted _MEI temp directory. std only offers SIGKILL.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Account: cloud token in the OS credential store. keyring 3.x ships NO backend
# by default — it silently falls back to an in-memory mock, so tokens never
# persist (0.1.2 shipped that way). Each platform must opt into its real vault.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }        # Keychain

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }      # Credential Manager
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }  # libsecret via D-Bus

[workspace]
