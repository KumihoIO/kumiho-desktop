# kumiho-desktop — Tauri control-center. The Brain graph view (See pillar) is the
# root kumiho-brain server, spawned as a child process and shown in an iframe;
# the Run/Account/Connect/Upgrade pillars are native commands here.
#
# Own [workspace] so it stays independent of the root kumiho-brain crate.
[package]
name = "kumiho-desktop"
version = "0.1.5"
edition = "2021"
rust-version = "1.77"
description = "Kumiho Desktop — control center for Kumiho Memory (CE/Cloud, plugins, Brain view)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"          # in-app auto-update (signed artifacts + latest.json)
tauri-plugin-single-instance = "2"  # collapse a duplicate launch (updater relaunch on Windows)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"      # locate ~/.kumiho for the Run pillar
ureq = "2"      # Account: probe the cloud control plane natively — a webview
                # fetch to control.kumiho.cloud is CORS-blocked (no ACAO header)

# Account: cloud token in the OS credential store. keyring 3.x ships NO backend
# by default — it silently falls back to an in-memory mock, so tokens never
# persist (0.1.2 shipped that way). Each platform must opt into its real vault.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }        # Keychain

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }      # Credential Manager

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }  # libsecret via D-Bus

[workspace]
